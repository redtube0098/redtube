<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Floating Bottom Nav</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0e17;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    position: relative;
  }

  .bottom-nav {
    position: fixed;
    bottom: 15px;
    left: 15px;
    right: 15px;
    max-width: 450px;
    margin: 0 auto;
    border-radius: 24px;
    background: rgba(19, 22, 34, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 6px;
    z-index: 10;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: none;
    border: none;
    color: #8b94a7;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    flex: 1;
    padding: 6px 0;
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.15s ease;
  }

  .nav-item.active {
    color: #f87171;
  }

  .nav-item.active svg {
    filter: drop-shadow(0 0 6px rgba(248, 113, 113, 0.6));
  }

  .nav-item:active svg {
    transform: scale(0.88);
  }

  .nav-item.center {
    position: relative;
    color: #fff;
  }

  .nav-item.center .nav-center-btn {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    margin-top: -30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, #f97362, #ef4444 55%, #b91c1c 100%);
    box-shadow:
      0 0 0 4px rgba(19, 22, 34, 0.55),
      0 6px 18px rgba(239, 68, 68, 0.55),
      0 0 24px rgba(239, 68, 68, 0.35);
  }

  .nav-item.center .nav-center-btn svg {
    width: 24px;
    height: 24px;
    stroke: #fff;
  }

  .nav-item.center::after {
    content: "";
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid rgba(239, 68, 68, 0.5);
    animation: nav-center-ping 2s ease-out infinite;
    pointer-events: none;
  }

  @keyframes nav-center-ping {
    0%   { transform: translateX(-50%) scale(1);   opacity: 0.6; }
    100% { transform: translateX(-50%) scale(1.6); opacity: 0; }
  }

  .nav-item.center span {
    margin-top: 2px;
    color: #f0f2f6;
  }
</style>
</head>
<body>

<div class="bottom-nav">
  <button class="nav-item active" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    <span>Home</span>
  </button>

  <button class="nav-item" data-tab="spin">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
    <span>Spin</span>
  </button>

  <button class="nav-item center" data-tab="earning">
    <div class="nav-center-btn">
      <svg viewBox="0 0 24 24"><path d="M12 3c-2.2 0-4 1.5-4 3.4 0 1 .4 1.8 1 2.4-2.8.8-4.6 3.1-4.6 6 0 3.4 3.4 6.2 7.6 6.2s7.6-2.8 7.6-6.2c0-2.9-1.8-5.2-4.6-6 .6-.6 1-1.4 1-2.4C16 4.5 14.2 3 12 3Z"/><path d="M12 12.5v4M10 14.5h4"/></svg>
    </div>
    <span>Earning</span>
  </button>

  <button class="nav-item" data-tab="task">
    <svg viewBox="0 0 24 24"><path d="M4 6.5l1.3 1.3L8 5"/><path d="M4 12.5l1.3 1.3L8 11"/><path d="M4 18.5l1.3 1.3L8 17"/><path d="M11 6.5h9M11 12.5h9M11 18.5h9"/></svg>
    <span>Task</span>
  </button>

  <button class="nav-item" data-tab="refer">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.4 2.9-6 6.5-6s6.5 2.6 6.5 6"/><circle cx="18" cy="9" r="2.4"/><path d="M15.5 20c.2-2.6 2-4.7 4.7-5.1"/></svg>
    <span>Refer</span>
  </button>
</div>

<script>
  document.querySelectorAll(".nav-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
</script>

</body>
</html>
