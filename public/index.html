<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>REDTUBE</title>

<!-- Content-Security-Policy: restricts which domains can load scripts/connect,
     limiting damage if any injection point is ever found (defense in depth).
     script-src stays strict (only trusted, named domains) since script
     injection is the highest-risk vector. connect-src allows https: broadly
     ONLY because ad networks (Monetag/Adsgram/Adexium/GigaPub) rotate their
     bid-serving domains dynamically for anti-adblock purposes, making a
     fixed whitelist impractical to maintain. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://telegram.org https://libtl.com https://sad.adsgram.ai https://cdn.tgads.space https://ad.gigapub.tech 'unsafe-inline';
  connect-src 'self' https://bid.tgads.live https://api.telegram.org https:;
  img-src 'self' https: data:;
  style-src 'self' 'unsafe-inline' https://cdn.tgads.space;
  frame-src https:;
">

<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='11276042' data-sdk='show_11276042'></script>
<!-- Adsgram SDK -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<!-- Adexium SDK -->
<script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const adexiumWidget = new AdexiumWidget({wid: 'f4753148-de2d-4899-8fd9-8bcb04e195eb', adFormat: 'interstitial'});
        adexiumWidget.autoMode();
    });
</script>
<!-- GigaPub SDK -->
<script src="https://ad.gigapub.tech/script?id=7256"></script>
</head>
<body>
<div id="app">
  <div class="header" id="mainHeader" style="display:none;">
    <div class="brand">
      <div class="logo">R</div>
      <span>REDTUBE</span>
    </div>
    <div class="icons">
      <button class="icon-btn" id="historyBtn" title="Withdraw history">🕐</button>
      <button class="icon-btn" id="profileBtn" title="Profile">👤</button>
    </div>
  </div>
<div class="loading-screen" id="loadingScreen">
    <div class="loading-logo-wrap">
      <div class="flame-wrap">
        <span class="flame flame-1"></span>
        <span class="flame flame-2"></span>
        <span class="flame flame-3"></span>
        <span class="flame flame-4"></span>
        <span class="flame flame-5"></span>
      </div>
      <div class="spark-wrap">
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>
        <span class="spark s5"></span>
        <span class="spark s6"></span>
      </div>
      <div class="ring-outer">
        <span class="orbit-dot dot-top"></span>
        <span class="orbit-dot dot-bottom"></span>
      </div>
      <div class="ring-inner"></div>
      <div class="ring-inner ring-inner-2"></div>
      <div class="loading-logo">
        <span class="logo-dot d1"></span>
        <span class="logo-dot d2"></span>
        <span class="logo-dot d3"></span>
        <span class="logo-dot d4"></span>
        <div class="logo-play"></div>
      </div>
    </div>
    <div class="loading-title"><span>RED</span>TUBE</div>
    <div class="loading-sub">Watch · Earn · Withdraw</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-percent" id="progressPercent">10%</div>
    </div>
    <div class="loading-tagline">Passive Income <span class="tag-dot">•</span> Easy Withdraw</div>
  </div>
  <div class="join-gate" id="joinGate" style="display:none;">
    <div class="rocket-ring">🚀</div>
    <h2>One last step to earn</h2>
    <p>Join our official channel &amp; community to unlock REDTUBE.</p>
    <div class="join-buttons">
      <a class="join-btn" href="https://t.me/redtubecommunity" target="_blank" rel="noopener noreferrer"><span class="emoji">📢</span>Join Channel</a>
      <a class="join-btn" href="https://t.me/redtubeofficial00" target="_blank" rel="noopener noreferrer"><span class="emoji">💬</span>Join Community</a>
    </div>
    <button class="check-btn" id="checkJoinBtn">✅ I've joined, check now</button>
    <div class="error-msg" id="joinError" style="display:none;">You haven't joined both yet. Please join and try again.</div>
  </div>
  <div class="content" id="mainContent" style="display:none;"></div>
  <div class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="nav-item active" data-tab="home">
      <span class="nav-icon-svg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/>
          <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>
        </svg>
      </span>
      Home
    </button>
    <button class="nav-item" data-tab="spin">
      <span class="nav-icon-svg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      Spin
    </button>
    <button class="nav-item center" data-tab="earning"><span class="nav-icon">💰</span>Earning</button>
    <button class="nav-item" data-tab="task">
      <span class="nav-icon-svg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6.5l1.3 1.3L8 5"/>
          <path d="M4 12.5l1.3 1.3L8 11"/>
          <path d="M4 18.5l1.3 1.3L8 17"/>
          <path d="M11 6.5h9M11 12.5h9M11 18.5h9"/>
        </svg>
      </span>
      Task
    </button>
    <button class="nav-item" data-tab="refer">
      <span class="nav-icon-svg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.2"/>
          <path d="M2.5 20c0-3.4 2.9-6 6.5-6s6.5 2.6 6.5 6"/>
          <circle cx="18" cy="9" r="2.4"/>
          <path d="M15.5 20c.2-2.6 2-4.7 4.7-5.1"/>
        </svg>
      </span>
      Refer
    </button>
  </div>
  <div class="modal-overlay" id="withdrawModal"></div>
  <div class="modal-overlay" id="converterModal"></div>
  <div class="modal-overlay" id="historyModal"></div>
  <div class="modal-overlay" id="profileModal"></div>
  <div class="modal-overlay" id="promoModal"></div>
  <div class="modal-overlay" id="specialTaskModal"></div>
</div>
<script src="guard.js"></script>
</body>
</html>
